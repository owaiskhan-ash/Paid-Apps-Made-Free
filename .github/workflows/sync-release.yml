name: Sync latest releases

on:
  schedule:
    # Every 15 minutes, not daily. Apps 01 and 02 name their APK after the app, so
    # their buttons stay correct between runs; 03 Teal stamps the version into every
    # asset name (teal-v0.4.0-arm64-v8a.apk), so its pinned filename starts
    # 404ing the moment a tag is published. This cadence re-pins that name within
    # minutes instead of within a day. GitHub may delay a scheduled run under load,
    # and a push or the repository_dispatch below still refreshes it immediately.
    - cron: "*/15 * * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [app-release]

permissions:
  contents: write

concurrency:
  group: sync-latest-release
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Point every download button at the newest release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/sync_release.py

      - name: Verify the page and the release agree
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 tools/sync_release.py --check
          python3 tools/sync_release.py --verify
          python3 -m unittest discover -s tests -v

      - name: Commit the refreshed version labels
        run: |
          if git diff --quiet -- index.html; then
            echo "Already on the latest releases."
            exit 0
          fi
          versions="$(python3 tools/sync_release.py --offline | python3 -c 'import json,sys; print(", ".join("%s %s %s" % (a["num"], a["name"], a["tag"]) for a in json.load(sys.stdin)["apps"]))')"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Point the download buttons at the latest releases (${versions})"
          git push
